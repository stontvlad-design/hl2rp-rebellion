<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Rebellion Loading</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        /* Изначальный фон */
        background: url("bg.jpg") no-repeat center center fixed;
        background-size: cover;
        font-family: "Segoe UI", Arial, sans-serif;
        color: white;
        position: relative;
    }

    .fade-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 45%;
        background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
        pointer-events: none;
    }

    /* Убрали mix-blend-mode, так как он убивает FPS в GMod */
    .noise {
        pointer-events: none;
        position: absolute;
        width: 100%;
        height: 100%;
        background: url("noise.jpg");
        opacity: 0.05; /* Низкая прозрачность вместо сложного рендера */
        /* Резкая, "дерганая" анимация (2 кадра), почти не ест ресурсы */
        animation: noiseMove 0.5s steps(2) infinite;
    }

    @keyframes noiseMove {
        0% { transform: translate(0,0); }
        100% { transform: translate(-5%, -5%); }
    }

    /* Оптимизированные сканлайны без mix-blend-mode */
    .scanlines {
        pointer-events: none;
        position: absolute;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03) 0px,
            rgba(255,255,255,0.03) 1px,
            rgba(0,0,0,0) 2px
        );
        opacity: 0.4;
    }

    /* --- ЛОГО по центру --- */
    /* Удалили все плавающие анимации и плавное появление */
    .logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        width: 320px;
        height: auto;
        /* Оставили статичное свечение */
        filter: drop-shadow(0 0 15px rgba(255,120,0,0.8));
    }

    /* --- БЛОК С ФРАЗАМИ --- */
    .loading-text {
        position: absolute;
        bottom: 60px;
        width: 100%;
        text-align: center;
    }

    /* Убрали пульсацию линии */
    .red-line {
        width: 420px;
        height: 3px;
        margin: 0 auto 15px auto;
        background: #d62929;
        border-radius: 6px;
        box-shadow: 0 0 10px #d62929;
    }

    /* Удалили opacity transition. Текст будет меняться резко */
    #dynamicText {
        margin-top: 10px;
        font-size: 28px;
        font-weight: 300;
        text-shadow: 0 0 8px rgba(255, 90, 90, 0.55);
    }
</style>
</head>

<body>

<div class="noise"></div>
<div class="scanlines"></div>
<div class="fade-bottom"></div>

<img src="Reblogo.png" class="logo">

<div class="loading-text">
    <div class="red-line"></div>
    <div id="dynamicText">Подключение к узлу...</div>
</div>

<script>
// === СИСТЕМА ФРАЗ (Атмосфера HL2RP) ===
const phrases = [
    "Синхронизация биометрических данных...",
    "Установка соединения с сетью Нексус-Надзора...",
    "Гражданин, ваше сотрудничество поощряется.",
    "Загрузка протоколов безопасности Альянса...",
    "Внимание: Замечена нелегальная активность в Секторе D4.",
    "Подключение к зашифрованным частотам...",
    "Они следят. Контролируй свои слова.",
    "Инициализация системы распределения рационов...",
    "Доступ к базе данных лоялистов...",
    "Ожидание авторизации диспетчера..."
];

const textElement = document.getElementById("dynamicText");
let lastPhrase = "";

function changePhrase() {
    let newPhrase = lastPhrase;
    // Ищем новую фразу, чтобы она не повторялась
    while (newPhrase === lastPhrase) {
        newPhrase = phrases[Math.floor(Math.random() * phrases.length)];
    }
    lastPhrase = newPhrase;
    
    // Резкая смена текста
    textElement.textContent = newPhrase;
}

// Запускаем первую фразу и ставим таймер на смену каждые 6 секунд
changePhrase();
setInterval(changePhrase, 6000);

// === СИСТЕМА ФОНОВ ===
const backgrounds = [
    "bg.jpg",
    "bg1.jpg",
    "bg2.jpg",
    "bg3.jpg",
    "bg4.jpg"
];
let currentBgIndex = 0;

function changeBackground() {
    currentBgIndex++;
    // Если дошли до конца массива - возвращаемся к началу
    if (currentBgIndex >= backgrounds.length) {
        currentBgIndex = 0;
    }
    // Резко меняем картинку фона
    document.body.style.backgroundImage = `url('${backgrounds[currentBgIndex]}')`;
}

// Таймер для фона (смена каждые 15 секунд)
setInterval(changeBackground, 15000);
</script>

</body>
</html>
